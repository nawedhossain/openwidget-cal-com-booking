<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="Book an appointment using an inline Cal.com calendar.">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Cal.com Booking</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; width: 100%; }
    body { min-height: 100vh; background: transparent; color: CanvasText; }
    #my-cal-inline { width: 100%; min-height: 100vh; overflow: auto; }
    .message-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .message { width: min(100%, 440px); border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 16px; padding: 24px; background: Canvas; color: CanvasText; }
    .message h1 { margin: 0 0 8px; font-size: 20px; }
    .message p { margin: 0; line-height: 1.55; opacity: .78; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div id="my-cal-inline" aria-label="Cal.com booking calendar"></div>
  <script>
    (function () {
      "use strict";

      const query = new URLSearchParams(window.location.search);
      const pathRaw = (query.get("calPath") || "").trim().replace(/^\/+|\/+$/g, "");
      const requestedTheme = (query.get("theme") || "dark").trim().toLowerCase();
      const theme = requestedTheme === "light" ? "light" : "dark";
      const requestedLayout = (query.get("layout") || "month_view").trim().toLowerCase();
      const layout = requestedLayout === "week_view" ? "week_view" : "month_view";
      const colorRaw = (query.get("brandColor") || "").trim();
      const colorCandidate = colorRaw.startsWith("#") ? colorRaw.slice(1) : colorRaw;
      const brandColor = /^[0-9a-fA-F]{6}$/.test(colorCandidate) ? "#" + colorCandidate : "";
      const mount = document.getElementById("my-cal-inline");

      // Accept a Cal.com username or a slash-separated username/team/event path only.
      const validPath = pathRaw && pathRaw.split("/").every(function (part) {
        return /^[a-zA-Z0-9._~-]+$/.test(part) && part !== "." && part !== "..";
      });

      function showMessage(title, detail) {
        mount.innerHTML = "";
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrap";
        const card = document.createElement("section");
        card.className = "message";
        const heading = document.createElement("h1");
        heading.textContent = title;
        const paragraph = document.createElement("p");
        paragraph.textContent = detail;
        card.append(heading, paragraph);
        wrapper.appendChild(card);
        mount.appendChild(wrapper);
      }

      if (!validPath) {
        showMessage(
          "Cal.com booking isn't configured yet",
          "In your OpenWidget app settings, add a valid Cal.com booking path such as yourname/30min, then save the app configuration."
        );
        return;
      }

      // Cal.com's official inline-embed bootstrap, with configuration taken from app properties.
      (function (C, A, L) {
        const pushCall = function (api, args) { api.q.push(args); };
        const doc = C.document;
        C.Cal = C.Cal || function () {
          const cal = C.Cal;
          const args = arguments;
          if (!cal.loaded) {
            cal.ns = {};
            cal.q = cal.q || [];
            const script = doc.createElement("script");
            script.src = A;
            script.async = true;
            doc.head.appendChild(script);
            cal.loaded = true;
          }
          if (args[0] === L) {
            const api = function () { pushCall(api, arguments); };
            const namespace = args[1];
            api.q = api.q || [];
            if (typeof namespace === "string") {
              cal.ns[namespace] = cal.ns[namespace] || api;
              pushCall(cal.ns[namespace], args);
              pushCall(cal, ["initNamespace", namespace]);
            } else {
              pushCall(cal, args);
            }
            return;
          }
          pushCall(cal, args);
        };
      })(window, "https://app.cal.com/embed/embed.js", "init");

      Cal("init", "openwidgetCal", { origin: "https://app.cal.com" });
      Cal.ns.openwidgetCal("inline", {
        elementOrSelector: "#my-cal-inline",
        config: {
          layout: layout,
          useSlotsViewOnSmallScreen: "true",
          theme: theme
        },
        calLink: pathRaw
      });

      const uiConfig = {
        theme: theme,
        hideEventTypeDetails: false,
        layout: layout
      };
      if (brandColor) {
        uiConfig.styles = { branding: { brandColor: brandColor } };
      }
      Cal.ns.openwidgetCal("ui", uiConfig);
    })();
  </script>
</body>
</html>
